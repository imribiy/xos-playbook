      command: >-
        $cs = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction SilentlyContinue;
        $guest = (-not $cs) -or ($cs.Manufacturer -eq 'Microsoft Corporation' -and $cs.Model -eq 'Virtual Machine');
        $backup = 'HKLM:\SOFTWARE\XOSToolkit\HyperVServiceBackup';
        foreach ($svc in @(@('storflt', 0), @('spaceparser', 3), @('bttflt', $null), @('vpci', $null))) {
          $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\' + $svc[0];
          if ($null -eq (Get-ItemProperty -LiteralPath $path -Name 'Type' -ErrorAction SilentlyContinue)) { continue };
          if ($guest -and $svc[0] -ne 'spaceparser') { Write-Output ('Hyper-V: ' + $svc[0] + ' left enabled because ' + $(if ($cs) { 'Windows runs as a Hyper-V guest' } else { 'the computer model could not be read' })); continue };
          if ($null -ne $svc[1]) {
            if (-not (Test-Path $backup)) { New-Item -Path $backup -Force | Out-Null };
            New-ItemProperty -Path $backup -Name $svc[0] -PropertyType DWord -Value $svc[1] -Force -ErrorAction SilentlyContinue | Out-Null;
            if ((Get-ItemProperty -Path $backup -Name $svc[0] -ErrorAction SilentlyContinue).($svc[0]) -ne $svc[1]) { Write-Output ('Hyper-V: the restore value for ' + $svc[0] + ' could not be recorded') }
          };
          New-ItemProperty -LiteralPath $path -Name 'Start' -PropertyType DWord -Value 4 -Force -ErrorAction SilentlyContinue | Out-Null;
          if ((Get-ItemProperty -LiteralPath $path -Name 'Start' -ErrorAction SilentlyContinue).Start -ne 4) { Write-Output ('Hyper-V: Start 4 could not be set on ' + $svc[0]) }
        }
