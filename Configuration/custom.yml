        $defenderKeys = @('HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender','HKLM:\SOFTWARE\Microsoft\Windows Defender');
        $defenderValues = @('PassiveMode','IsServiceRunning','ServiceKeepAlive','PreviousRunningMode','DisableAntiSpyware','DisableAntiVirus');
        foreach ($k in $defenderKeys) {
          if (-not (Test-Path -LiteralPath $k)) { continue };
          $item = Get-Item -LiteralPath $k -ErrorAction SilentlyContinue;
          if ($null -eq $item) { continue };
          foreach ($v in $defenderValues) {
            if ($item.Property -contains $v) {
              try { Remove-ItemProperty -LiteralPath $k -Name $v -Force -ErrorAction Stop } catch { }
            }
          }
        };
        $realtimeKeys = @('HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time Protection','HKLM:\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection');
