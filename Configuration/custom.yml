  - !powerShell:
      wait: true
      weight: 5
      command: >-
        $policyPath = 'HKLM:\SOFTWARE\Microsoft\PolicyManager\default\DmaGuard\DeviceEnumerationPolicy';
        try { if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }; Set-ItemProperty -Path $policyPath -Name 'value' -Value 2 -Force -ErrorAction SilentlyContinue } catch {};
        $nicServices = @{};
        try {
          foreach ($bus in @(Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Enum' -ErrorAction SilentlyContinue)) {
            foreach ($dev in @(Get-ChildItem -LiteralPath $bus.PSPath -ErrorAction SilentlyContinue)) {
              foreach ($inst in @(Get-ChildItem -LiteralPath $dev.PSPath -ErrorAction SilentlyContinue)) {
                $props = Get-ItemProperty -LiteralPath $inst.PSPath -ErrorAction SilentlyContinue;
                if ($props -and $props.ClassGUID -eq '{4d36e972-e325-11ce-bfc1-08002be10318}' -and $props.Service) { $nicServices[([string]$props.Service).ToLowerInvariant()] = $true }
              }
            }
          }
        } catch {};
        $dmaBackup = 'HKLM:\SOFTWARE\XOSToolkit\DmaRemappingBackup';
        try {
          Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services' -ErrorAction SilentlyContinue | ForEach-Object {
            if ($nicServices.ContainsKey($_.PSChildName.ToLowerInvariant())) { return };
            $paramsPath = $_.PSPath + '\Parameters';
            if (Test-Path $paramsPath) {
              try {
                $val = (Get-ItemProperty -Path $paramsPath -Name 'DmaRemappingCompatible' -ErrorAction SilentlyContinue).DmaRemappingCompatible;
                if ($null -ne $val) {
                  if (([int]$val -ne 0) -and -not (Test-Path -LiteralPath $dmaBackup)) { New-Item -Path $dmaBackup -Force | Out-Null };
                  if (([int]$val -ne 0) -and ($null -eq (Get-ItemProperty -LiteralPath $dmaBackup -Name $_.PSChildName -ErrorAction SilentlyContinue).($_.PSChildName))) { New-ItemProperty -LiteralPath $dmaBackup -Name $_.PSChildName -PropertyType DWord -Value ([int]$val) -Force -ErrorAction SilentlyContinue | Out-Null };
                  Set-ItemProperty -Path $paramsPath -Name 'DmaRemappingCompatible' -Value 0 -Force -ErrorAction SilentlyContinue
                }
              } catch {}
            }
          }
        } catch {}

