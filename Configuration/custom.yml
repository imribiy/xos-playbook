        $p = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform';
        if (Test-Path -LiteralPath $p) {
          Get-ChildItem -LiteralPath $p -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object {
            $off = Join-Path $_.FullName 'OFFmeansOFF.exe';
            $on = Join-Path $_.FullName 'MpCmdRun.exe';
            if ((Test-Path -LiteralPath $off) -and !(Test-Path -LiteralPath $on)) {
              try { Rename-Item -LiteralPath $off -NewName 'MpCmdRun.exe' -Force -ErrorAction Stop } catch { }
