  - !writeStatus: {status: 'Synchronizing System Time'}
  - !cmd: {command: 'sc config w32time start=demand & net stop w32time >nul 2>&1 & w32tm /unregister & w32tm /register & net start w32time & w32tm /config /manualpeerlist:"time.windows.com,0x9 pool.ntp.org,0x9 time.nist.gov,0x9" /syncfromflags:manual /reliable:yes /update & net stop w32time >nul 2>&1 & net start w32time & w32tm /resync /rediscover', runas: trustedInstaller, wait: true, errorAction: Ignore}

  - !writeStatus: {status: 'Applying New Account Defaults'}
  - !powerShell:
      wait: true
      command: >-
        $profileDir = [Environment]::ExpandEnvironmentVariables((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList').Default);
        $hive = Join-Path $profileDir 'NTUSER.DAT';
        $mount = 'HKU\XOS_DefaultUser';
        $values = @(
          @('Software\Microsoft\Windows\CurrentVersion\PushNotifications', 'ToastEnabled', 1),
          @('Software\Microsoft\Clipboard', 'EnableClipboardHistory', 1),
          @('Software\Microsoft\GameBar', 'AllowAutoGameMode', 0),
          @('Software\Microsoft\GameBar', 'AutoGameModeEnabled', 0),
          @('Software\Microsoft\GameBar', 'ShowStartupPanel', 0),
          @('Software\Microsoft\GameBar', 'UseNexusForGameBarEnabled', 0),
          @('Software\Microsoft\Windows\CurrentVersion\GameDVR', 'AppCaptureEnabled', 0),
          @('Software\Microsoft\Windows\CurrentVersion\GameDVR', 'AudioCaptureEnabled', 0),
          @('Software\Microsoft\Windows\CurrentVersion\GameDVR', 'CursorCaptureEnabled', 0),
          @('Software\Microsoft\Windows\CurrentVersion\GameDVR', 'GameDVR_Enabled', 0));
        $out = reg.exe load $mount $hive 2>&1;
        if ($LASTEXITCODE -ne 0) { Write-Output ('FAILED Default user profile: ' + $hive + ' could not be loaded, new accounts keep the Windows values: ' + ($out -join ' ')) } else {
          foreach ($v in $values) {
            reg.exe add ($mount + '\' + $v[0]) /v $v[1] /t REG_DWORD /d $v[2] /f 2>&1 | Out-Null;
            $read = Get-ItemProperty -Path ('Registry::HKEY_USERS\XOS_DefaultUser\' + $v[0]) -Name $v[1] -ErrorAction SilentlyContinue;
            if (-not $read -or $read.($v[1]) -ne $v[2]) { Write-Output ('FAILED Default user profile: ' + $v[0] + '\' + $v[1] + ' could not be set to ' + $v[2]) }
          };
          $read = $null; [gc]::Collect(); [gc]::WaitForPendingFinalizers();
          $out = reg.exe unload $mount 2>&1;
          if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 3; [gc]::Collect(); $out = reg.exe unload $mount 2>&1 };
          if ($LASTEXITCODE -ne 0) { Write-Output ('FAILED Default user profile: the hive could not be unloaded: ' + ($out -join ' ')) }
        }

  - !writeStatus: {status: 'Applying Service Grouping'}
  - !powerShell:
      wait: true
      runas: trustedInstaller
      command: >-
        foreach ($name in @('BFE','DcomLaunch','mpssvc','PlugPlay','Power','SamSs','EventSystem','CryptSvc','Dhcp','Dnscache','DisplayEnhancementService','PcaSvc','WdiSystemHost','AudioEndpointBuilder','Appinfo','BITS','gpsvc','SENS','ShellHWDetection','TrkWks','Winmgmt','EventLog','FontCache','Schedule','SessionEnv','Themes','W32Time')) {
          $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\' + $name;
          if ($null -eq (Get-ItemProperty -LiteralPath $path -Name 'Type' -ErrorAction SilentlyContinue)) { continue };
          New-ItemProperty -LiteralPath $path -Name 'SvcHostSplitDisable' -PropertyType DWord -Value 1 -Force -ErrorAction SilentlyContinue | Out-Null;
          if ((Get-ItemProperty -LiteralPath $path -Name 'SvcHostSplitDisable' -ErrorAction SilentlyContinue).SvcHostSplitDisable -ne 1) { Write-Output ('Service grouping: SvcHostSplitDisable could not be set on ' + $name) }
        }

