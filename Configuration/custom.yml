  - !writeStatus: {status: 'Configuring Windows Update'}
  - !powerShell:
      wait: true
      runas: currentUserElevated
      errorAction: Ignore
      command: >-
        $log = Join-Path $env:ProgramData 'AME\Logs\XOS-Scripts.log';
        function Write-XosLog([string]$m) { try { if (!(Test-Path (Split-Path $log -Parent))) { New-Item -Path (Split-Path $log -Parent) -ItemType Directory -Force | Out-Null }; ('[' + (Get-Date -Format 'yyyy-MM-dd HH:mm:ss') + '] WindowsUpdateLegacy: ' + $m) | Out-File -FilePath $log -Append -Encoding utf8 } catch { } };
        $ux = 'HKLM:\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings';
        $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate';
        $mau = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU';
        $uau = 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU';
        function Get-XosValue([string]$k, [string]$n) { try { $i = Get-Item -LiteralPath $k -ErrorAction Stop; $v = $i.GetValue($n, $null, 'DoNotExpandEnvironmentNames'); if ($null -eq $v) { return $null }; return @{ Kind = [string]$i.GetValueKind($n); Value = $v } } catch { return $null } };
        function Test-XosSz([string]$k, [string]$n, [string[]]$w) { $r = Get-XosValue $k $n; return ($null -ne $r -and $r.Kind -eq 'String' -and $w -ccontains [string]$r.Value) };
        function Test-XosDw([string]$k, [string]$n, [int[]]$w) { $r = Get-XosValue $k $n; return ($null -ne $r -and $r.Kind -eq 'DWord' -and $w -contains [int]$r.Value) };
        $end = @('2038-01-19T03:14:07Z');
        $start = @('2025-01-01T00:00:00Z');
        $del = New-Object System.Collections.ArrayList;
        function Add-XosDelete([string]$k, [string]$n) { foreach ($x in $del) { if ($x[0] -eq $k -and $x[1] -eq $n) { return } }; [void]$del.Add(@($k, $n)) };
        $expiry = Test-XosSz $ux 'PauseUpdatesExpiryTime' $end;
        $featureEnd = Test-XosSz $ux 'PauseFeatureUpdatesEndTime' $end;
        $qualityEnd = Test-XosSz $ux 'PauseQualityUpdatesEndTime' $end;
        $securityOnly = Test-XosDw $ux 'BranchReadinessLevel' @(20);
        $mauNoAuto = Get-XosValue $mau 'NoAutoUpdate';
        if ($expiry) { Add-XosDelete $ux 'PauseUpdatesExpiryTime' };
        if ($featureEnd) { Add-XosDelete $ux 'PauseFeatureUpdatesEndTime' };
        if ($qualityEnd) { Add-XosDelete $ux 'PauseQualityUpdatesEndTime' };
        foreach ($n in @('PauseUpdatesStartTime', 'PauseFeatureUpdatesStartTime', 'PauseQualityUpdatesStartTime', 'PausedFeatureDate', 'PausedQualityDate')) { if (Test-XosSz $ux $n $start) { Add-XosDelete $ux $n } };
        if (Test-XosDw $ux 'FlightSettingsMaxPauseDays' @(5269)) { Add-XosDelete $ux 'FlightSettingsMaxPauseDays' };
        if ($featureEnd -and (Test-XosDw $ux 'PausedFeatureStatus' @(1))) { Add-XosDelete $ux 'PausedFeatureStatus' };
        if ($qualityEnd -and (Test-XosDw $ux 'PausedQualityStatus' @(1))) { Add-XosDelete $ux 'PausedQualityStatus' };
        if ($expiry -and (Test-XosDw $ux 'DeferFeatureUpdatesPeriodInDays' @(365))) { Add-XosDelete $ux 'DeferFeatureUpdatesPeriodInDays' };
        if ($expiry -and (Test-XosDw $ux 'DeferQualityUpdatesPeriodInDays' @(30))) { Add-XosDelete $ux 'DeferQualityUpdatesPeriodInDays' };
        if ($securityOnly) { Add-XosDelete $ux 'BranchReadinessLevel'; if (Test-XosDw $ux 'DeferFeatureUpdates' @(1)) { Add-XosDelete $ux 'DeferFeatureUpdates' }; if (Test-XosDw $ux 'DeferFeatureUpdatesPeriodInDays' @(365)) { Add-XosDelete $ux 'DeferFeatureUpdatesPeriodInDays' }; if (Test-XosDw $ux 'DeferQualityUpdates' @(1)) { Add-XosDelete $ux 'DeferQualityUpdates' }; if (Test-XosDw $ux 'DeferQualityUpdatesPeriodInDays' @(7)) { Add-XosDelete $ux 'DeferQualityUpdatesPeriodInDays' }; if ($null -eq $mauNoAuto -and (Test-XosDw $mau 'AUOptions' @(2))) { Add-XosDelete $mau 'AUOptions' } };
        if ($null -eq (Get-XosValue $pol 'DeferFeatureUpdates') -and (Test-XosDw $pol 'DeferFeatureUpdatesPeriodInDays' @(365))) { Add-XosDelete $pol 'DeferFeatureUpdatesPeriodInDays' };
        if ($null -eq (Get-XosValue $pol 'DeferQualityUpdates') -and (Test-XosDw $pol 'DeferQualityUpdatesPeriodInDays' @(30))) { Add-XosDelete $pol 'DeferQualityUpdatesPeriodInDays' };
        if (Test-XosDw $uau 'NoAutoUpdate' @(1)) { Add-XosDelete $uau 'NoAutoUpdate'; if (Test-XosDw $uau 'AUOptions' @(1)) { Add-XosDelete $uau 'AUOptions' } };
        if ((Test-XosDw $mau 'NoAutoUpdate' @(1)) -and (Test-XosDw $mau 'AUOptions' @(1))) { Add-XosDelete $mau 'AUOptions' };
        foreach ($d in $del) { $was = (Get-XosValue $d[0] $d[1]).Value; Remove-ItemProperty -LiteralPath $d[0] -Name $d[1] -Force -ErrorAction SilentlyContinue | Out-Null; if ($null -eq (Get-XosValue $d[0] $d[1])) { Write-XosLog ('removed old XOS value ' + $d[0] + '\' + $d[1] + ' (was ' + $was + ')') } else { Write-XosLog ('FAILED to remove old XOS value ' + $d[0] + '\' + $d[1] + ' (still ' + $was + ')') } }
