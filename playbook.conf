<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>XOS</Name>
	<Username>XOS</Username>
  <Title>XOS Playbook v0.814</Title>
	<ShortDescription>Created by imribiy</ShortDescription>
	<Description>XOS is a playbook that focuses on improving gaming performance and privacy.</Description>
	<Details>XOS is a playbook that focuses on improving gaming performance and privacy.</Details>
	<ProgressText>Playbook is being applied. Since this playbook tries to aim wide range of Windows versions, some errors may occur. If the installation doesn't reboot yourself, reboot your computer after everything is done.</ProgressText>
  <Version>0.814</Version>
        <UpgradableFrom>any</UpgradableFrom>
	<UniqueId>eba9e12d-9b6f-4ead-afd7-17fa2dd102cd</UniqueId>
	<SupportedBuilds>
		<string>19045</string>
		<string>22631</string>
		<string>26200</string>
		<string>26300</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
	</Requirements>
	<Overhaul>false</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<Git>https://github.com/imribiy/xos-beta</Git>
	<Website>https://github.com/imribiy/XOS</Website>
	<FeaturePages>
		<RadioPage DefaultOption="disable-defender" Description="Disabling Defender improves performance. Can be re-enabled via XOS Toolkit.">
			<Options>
				<RadioOption>
					<Text>Disable Defender (Default)</Text>
					<Name>disable-defender</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Defender</Text>
					<Name>enable-defender</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="enable-uac" Description="Choose User Account Control behavior">
			<Options>
				<RadioOption>
					<Text>Enable UAC (Default)</Text>
					<Name>enable-uac</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable UAC [may break Microsoft login]</Text>
					<Name>disable-uac</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="remove-edge" Description="Choose what to do with Microsoft Edge">
			<Options>
				<RadioOption>
					<Text>Remove Microsoft Edge (Recommended)</Text>
					<Name>remove-edge</Name>
					<Description>Removes the Edge browser and shared WebView2 runtime. WebView2 can be reinstalled from XOS Toolkit.</Description>
				</RadioOption>
				<RadioOption>
					<Text>Keep Microsoft Edge</Text>
					<Name>keep-edge</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="change-wallpaper" Description="Choose whether to apply the XOS desktop and lock screen wallpaper">
			<Options>
				<RadioOption>
					<Text>Apply XOS Wallpaper (Default)</Text>
					<Name>change-wallpaper</Name>
				</RadioOption>
				<RadioOption>
					<Text>Keep Current Wallpaper</Text>
					<Name>keep-wallpaper</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="disable-printing" Description="Choose what to do with Windows printing services">
			<Options>
				<RadioOption>
					<Text>Disable Printing (Default)</Text>
					<Name>disable-printing</Name>
					<Description>Disables Print Spooler, related services, scheduled tasks, and printing Windows features. Can be re-enabled any time via XOS Toolkit (Peripherals tab).</Description>
				</RadioOption>
				<RadioOption>
					<Text>Keep Printing</Text>
					<Name>keep-printing</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Choose which XOS optimizations to apply:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Cleanup Taskbar and Start Menu</Text>
					<Name>cleanup-taskbar</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft OneDrive</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft Teams</Text>
					<Name>remove-teams</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove WSL (Windows Subsystem for Linux)</Text>
					<Name>remove-wsl</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Optional app removals:">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Photos App</Text>
					<Name>remove-photos</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Xbox Apps</Text>
					<Name>remove-xbox</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove AI Features (Copilot, Recall)</Text>
					<Name>remove-ai</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>
